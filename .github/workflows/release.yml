name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Create the .env file used by --dart-define-from-file.
      # Store the contents of your local .env as a base64-encoded GitHub secret
      # named ENV_FILE_BASE64, or skip this step if .env is not required.
      - name: Decode .env
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          if [ -n "$ENV_FILE_BASE64" ]; then
            echo "$ENV_FILE_BASE64" | base64 -d > .env
          else
            cp .env.example .env 2>/dev/null || touch .env
          fi

      # Firebase configuration for Android (google-services.json is gitignored).
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi

      # Configure release signing from GitHub secrets.
      # Secrets required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          fi

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Prepare release asset
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //')
          cp "build/app/outputs/apk/release/Kairo-${VERSION}-release.apk" "Kairo-${VERSION}-release.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Kairo-*.apk
          generate_release_notes: true
