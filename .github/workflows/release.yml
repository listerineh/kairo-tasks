name: Release Android (APK and AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned to the version the app is built and tested with; the
          # latest stable can make pubspec.lock fail to resolve.
          flutter-version: '3.47.1'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Create the .env file used by --dart-define-from-file.
      # Store the contents of your local .env as a base64-encoded GitHub secret
      # named ENV_FILE_BASE64, or skip this step if .env is not required.
      - name: Decode .env
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          if [ -n "$ENV_FILE_BASE64" ]; then
            echo "$ENV_FILE_BASE64" | base64 -d > .env
          else
            cp .env.example .env 2>/dev/null || touch .env
          fi

      # Firebase configuration for Android (google-services.json is gitignored).
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi

      # Configure release signing from GitHub secrets.
      # Secrets required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "::warning::KEYSTORE_BASE64 not set. The build is debug-signed; Google Play will reject the .aab."
          fi

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=.env

      # Google Play takes an Android App Bundle, signed with the upload key.
      - name: Build release app bundle
        run: flutter build appbundle --release --dart-define-from-file=.env

      - name: Prepare release assets
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //')
          cp "build/app/outputs/apk/release/Kairo-${VERSION}-release.apk" "Kairo-${VERSION}-release.apk"
          cp build/app/outputs/bundle/release/app-release.aab "Kairo-${VERSION}-release.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Kairo-*.apk
            Kairo-*.aab
          generate_release_notes: true
