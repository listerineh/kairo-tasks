name: Release iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-ios-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Check iOS signing secrets
        id: check
        env:
          IOS_P12_CERTIFICATE: ${{ secrets.IOS_P12_CERTIFICATE }}
        run: |
          if [ -n "$IOS_P12_CERTIFICATE" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::IOS_P12_CERTIFICATE not set. Skipping iOS release build."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  build-ios:
    needs: check-ios-secrets
    if: needs.check-ios-secrets.outputs.has_secrets == 'true'
    # iOS release builds must run on macOS and require valid Apple signing secrets.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Decode .env
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          if [ -n "$ENV_FILE_BASE64" ]; then
            echo "$ENV_FILE_BASE64" | base64 -d > .env
          else
            cp .env.example .env 2>/dev/null || touch .env
          fi

      # Firebase configuration for iOS (GoogleService-Info.plist is gitignored).
      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/Runner/GoogleService-Info.plist
          fi

      # Required secrets:
      #   IOS_P12_CERTIFICATE    -> base64 of the .p12 distribution/development certificate
      #   IOS_P12_PASSWORD       -> password for the .p12 file
      #   IOS_PROVISIONING_PROFILE_BASE64 -> base64 of the .mobileprovision profile
      #   IOS_TEAM_ID            -> Apple Team ID (e.g. V9G9CUPUMF)
      #   IOS_PROVISIONING_NAME  -> exact name of the provisioning profile
      - name: Install Apple certificate
        env:
          IOS_P12_CERTIFICATE: ${{ secrets.IOS_P12_CERTIFICATE }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_CERTIFICATE" | base64 -d > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-keychain-settings -lut 1200 build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -s build.keychain
          rm certificate.p12

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Create ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_NAME: ${{ secrets.IOS_PROVISIONING_NAME }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.kairotasks.kairotasks</key>
              <string>${IOS_PROVISIONING_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build release IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --dart-define-from-file=.env

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/ipa/*.ipa
          generate_release_notes: true
