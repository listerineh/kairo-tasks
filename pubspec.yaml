name: kairotasks
description: "Collaborative productivity app that elevates task management with real-time social features, calendar views, and accessibility-first design."
publish_to: 'none'
version: 1.17.11+97

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0

  # Backend - Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.8.1

  # Calendar
  table_calendar: ^3.1.3

  # Local Storage
  shared_preferences: ^2.3.4

  # Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0

  # Utils
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  url_launcher: ^6.2.5
  intl: ^0.20.2
  dartz: ^0.10.1
  connectivity_plus: ^6.1.2
  uuid: ^4.5.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  image_picker: ^1.2.3
  flutter_timezone: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  injectable_generator: ^2.7.0

  # Icon generation
  flutter_launcher_icons: ^0.14.0

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/app_icon.svg
    - assets/icons/google_logo.svg
